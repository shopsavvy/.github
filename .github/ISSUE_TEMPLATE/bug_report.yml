name: Bug report
description: Something in this SDK, server or integration doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **never paste an API key** here; redact it as `ss_live_...`.
        For account, billing or key problems email support@shopsavvy.com instead. For security issues see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package version
      description: The SDK, MCP server or integration version you are using
      placeholder: e.g. 1.4.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: e.g. Python 3.12 on macOS 15, Node 20 on Ubuntu 22.04
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the call you made (identifiers are fine to share) and the full error, including `error_detail.code` and `meta.request_id` if the API returned one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem.
      render: text
